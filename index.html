<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雪鳞 · 分配水量（格子版 · 5 关）</title>
<style>
  html,body{margin:0;height:100%;background:#1b1f26;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{background:#D9D9D9;display:block;box-shadow:0 12px 48px rgba(0,0,0,.55);}
  .hide{display:none!important;}
  .gate{cursor:pointer;}
  .gate rect{transition:fill .12s ease;}
  .btn{cursor:pointer;}
  .btn:hover rect{filter:brightness(1.07);}
  #mask{position:absolute;inset:0;background:rgba(8,12,18,.32);display:flex;
    align-items:center;justify-content:center;z-index:20;}
  #dlg{background:#fff;border-radius:16px;padding:26px 32px;min-width:400px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);font-size:16px;color:#20242b;}
  #dlg h2{margin:0 0 14px;font-size:22px;}
  #dlg .row{display:flex;justify-content:space-between;gap:30px;padding:7px 0;
    border-bottom:1px dashed #e3e6ea;}
  #dlg .row:last-of-type{border-bottom:none;}
  #dlg .row b.ok{color:#1f9d55;}
  #dlg .row b.no{color:#d0433a;}
  #dlg .hint{font-size:13px;color:#77808a;line-height:1.6;margin:10px 0 16px;}
  #dlg .acts{display:flex;gap:10px;margin-top:8px;}
  #dlg button{flex:1;padding:11px 0;border:0;border-radius:9px;font-size:15px;
    cursor:pointer;background:#eef1f5;color:#2c333c;}
  #dlg button.pri{background:#2f8fd8;color:#fff;}
  #sel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:22px;background:#141821;}
  #sel .card{width:180px;padding:22px 16px;background:#232a35;border-radius:16px;
    color:#e8edf3;text-align:center;cursor:pointer;transition:.15s;border:1px solid #313a47;}
  #sel .card:hover{background:#2c3542;transform:translateY(-4px);}
  #sel .card b{font-size:20px;display:block;margin-bottom:8px;}
  #sel .card span{font-size:13px;color:#94a1b2;line-height:1.7;}
</style>
</head>

const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const mask  = document.getElementById('mask');
const dlg   = document.getElementById('dlg');
const selBox= document.getElementById('sel');

const C = {
  grid:'#8C8C8C', pipe:'#C8B06F', pool:'#86CEE2', goal:'#708F3E', trap:'#D56B6B',
  gateOff:'#E9AF90', gateOn:'#A9D9EE', gateStroke:'#C08A66', gateInk:'#4A3524',
  panel:'#DFD79D', btnStart:'#B0D87F', btnReset:'#DBB773', back:'#541D1B',
  water:'#3FB6EC', ink:'#1E3A47', inkLight:'#FFFFFF'
};

let cur = -1, open = [], phase = 'idle', res = null, L = null;
let gWater = null, gGate = null, gText = null, bStart = null, bReset = null;

function E(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function dOf(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' '); }
function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return s; }

/* ---------------- 选关 ---------------- */
function renderSelect() {
  mask.classList.add('hide');
  selBox.classList.remove('hide');
  selBox.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<b>' + lv.title + '</b><span>水闸 ' + lv.gates.length + ' 个<br>目标点 ' +
      lv.nodes.filter(n => n.kind === 'goal').length + ' 个</span>';
    d.onclick = () => { selBox.classList.add('hide'); renderLevel(i); };
    selBox.appendChild(d);
  });
}

/* ---------------- 渲染关卡 ---------------- */
function renderLevel(idx) {
  cur = idx; L = LEVELS[idx]; phase = 'edit'; res = null;
  open = L.gates.map(() => false);
  stage.innerHTML = '';

  const gGrid = E('g', {}, stage);
  const gPipe = E('g', {}, stage);
  gWater = E('g', {}, stage);
  const gNode = E('g', {}, stage);
  gGate = E('g', {}, stage);
  /* 文字层在最上方，但整体不接收指针事件 → 绝不影响水闸点击等交互 */
  gText = E('g', {'pointer-events':'none'}, stage);
  const gUI = E('g', {}, stage);

  for (let c = 0; c <= 32; c++) E('line', {x1:c*60, y1:0, x2:c*60, y2:1080, stroke:C.grid, 'stroke-width':2}, gGrid);
  for (let r = 0; r <= 18; r++) E('line', {x1:0, y1:r*60, x2:1920, y2:r*60, stroke:C.grid, 'stroke-width':2}, gGrid);

  L.edges.forEach(e => E('path', {d:dOf(e.pts), fill:'none', stroke:C.pipe, 'stroke-width':60,
    'stroke-linejoin':'miter', 'stroke-linecap':'butt'}, gPipe));

  L.nodes.forEach(n => drawNode(n, gNode, gText));

  L.gates.forEach((g, i) => {
    const grp = E('g', {class:'gate', 'data-i':i}, gGate);
    E('rect', {x:g.c*60, y:g.r*60, width:60, height:60, fill:C.gateOff,
      stroke:C.gateStroke, 'stroke-width':2}, grp);
    grp.addEventListener('click', () => {
      if (phase !== 'edit') return;
      open[i] = !open[i]; paintGates();
    });
    /* 水闸文字：画在 gText（在水闸组件之上），不接收指针事件；
       用 textLength 锁死宽度，保证绝不超出 60×60 的水闸格 */
    E('text', {x:g.c*60+30, y:g.r*60+38, 'text-anchor':'middle', 'font-size':22,
      'font-weight':'bold', fill:C.gateInk, textLength:38,
      'lengthAdjust':'spacingAndGlyphs'}, gText).textContent = '水闸';
  });
  paintGates();

  /* 返回键 */
  const gBack = E('g', {class:'btn'}, gUI);
  E('rect', {x:20, y:44, width:82, height:82, rx:8, fill:C.back}, gBack);
  E('path', {d:'M 62 66 L 62 104 L 38 85 Z', fill:'#F3F3F3'}, gBack);
  gBack.addEventListener('click', renderSelect);

  /* 面板 */
  E('rect', {x:60, y:180, width:360, height:180, rx:6, fill:C.panel}, gUI);
  L.panel.forEach((t, i) => {
    const y = 270 + (i - (L.panel.length - 1) / 2) * 34 + 7;
    E('text', {x:240, y:y, 'text-anchor':'middle', 'font-size':20,
      fill:'#4A3B14', 'font-weight': i === 0 ? 'bold' : 'normal'}, gUI).textContent = t;
  });

  /* 开始 / 重置 */
  const bS = E('g', {class:'btn'}, gUI);
  bStart = bS;
  E('rect', {x:1680, y:300, width:120, height:120, rx:8, fill:C.btnStart}, bS);
  E('text', {x:1740, y:372, 'text-anchor':'middle', 'font-size':26, fill:'#2C4A16'}, bS).textContent = '开始';
  bS.addEventListener('click', startFlow);

  const bR = E('g', {class:'btn'}, gUI);
  bReset = bR;
  E('rect', {x:1680, y:480, width:120, height:120, rx:8, fill:C.btnReset}, bR);
  E('text', {x:1740, y:552, 'text-anchor':'middle', 'font-size':26, fill:'#5A4415'}, bR).textContent = '重置';
  bR.addEventListener('click', resetLevel);

  fit();
}

function drawNode(n, gN, gT) {
  const b = n.box;
  const x = b[0]*60, y = b[1]*60, w = (b[2]-b[0]+1)*60, h = (b[3]-b[1]+1)*60;
  const fill = (n.kind === 'src' || n.kind === 'pool') ? C.pool :
               (n.kind === 'goal' ? C.goal : C.trap);
  E('rect', {x:x, y:y, width:w, height:h, rx:6, fill:fill,
    stroke:'rgba(0,0,0,.13)', 'stroke-width':2}, gN);
  const cx = x + w/2, cy = y + h/2;
  const isGoal = n.kind === 'goal';
  const col = isGoal ? C.inkLight : C.ink;

  if (n.kind === 'src') {
    E('text', {x:cx, y:cy-8, 'text-anchor':'middle', 'font-size':24, fill:col}, gT).textContent = n.label;
    E('text', {x:cx, y:cy+22, 'text-anchor':'middle', 'font-size':22, fill:col}, gT).textContent = '水量：' + n.water;
  } else if (isGoal) {
    if (w <= 120) {
      E('text', {x:cx, y:cy-26, 'text-anchor':'middle', 'font-size':20, fill:col}, gT).textContent = n.label;
      E('text', {x:cx, y:cy+2,  'text-anchor':'middle', 'font-size':20, fill:col}, gT).textContent = '所需水量：';
      E('text', {x:cx, y:cy+30, 'text-anchor':'middle', 'font-size':20, fill:col, 'data-goal':n.id}, gT)
        .textContent = '0/' + n.need;
    } else {
      E('text', {x:cx, y:cy-8, 'text-anchor':'middle', 'font-size':20, fill:col}, gT).textContent = n.label;
      E('text', {x:cx, y:cy+24, 'text-anchor':'middle', 'font-size':20, fill:col, 'data-goal':n.id}, gT)
        .textContent = '所需水量：0/' + n.need;
    }
  } else if (n.kind === 'trap') {
    /* 陷阱文字：「陷阱 / 会吸收流入水量的一半」两行。
       字号按外框宽度自适应，并用 textLength 把宽度锁死 → 绝不超出陷阱外框 */
    const t2 = '会吸收流入水量的一半';
    const f2 = Math.min(17, (w - 20) / t2.length);
    E('text', {x:cx, y:cy-11, 'text-anchor':'middle', 'font-size':25,
      'font-weight':'bold', fill:col}, gT).textContent = '陷阱';
    E('text', {x:cx, y:cy+21, 'text-anchor':'middle', 'font-size':f2, fill:col,
      textLength:Math.min(w - 20, f2 * t2.length),
      'lengthAdjust':'spacingAndGlyphs'}, gT).textContent = t2;
  } else {
    E('text', {x:cx, y:cy+8, 'text-anchor':'middle', 'font-size':24, fill:col}, gT).textContent = n.label;
  }
}

function paintGates() {
  gGate.querySelectorAll('g.gate').forEach(grp => {
    const i = +grp.dataset.i;
    grp.querySelector('rect').setAttribute('fill', open[i] ? C.gateOn : C.gateOff);
  });
}

/* ---------------- 模拟 ---------------- */
function simulate(lv, oset) {
  const indeg = {}; lv.nodes.forEach(n => indeg[n.id] = 0);
  lv.edges.forEach(e => indeg[e.to]++);
  const deg = Object.assign({}, indeg);
  const q = lv.nodes.filter(n => indeg[n.id] === 0).map(n => n.id);
  const order = [];
  while (q.length) {
    const k = q.shift(); order.push(k);
    lv.edges.forEach(e => { if (e.frm === k) { deg[e.to]--; if (deg[e.to] === 0) q.push(e.to); } });
  }
  if (order.length !== lv.nodes.length) return {val:{}, flow:{}, err:'cycle'};
  const acc = {}; lv.nodes.forEach(n => acc[n.id] = 0);
  const val = {}, flow = {};
  order.forEach(id => {
    const n = lv.nodes.find(x => x.id === id);
    let c = n.kind === 'src' ? n.water : acc[id];
    if (n.kind === 'trap') c /= 2;
    val[id] = c;
    if (n.kind === 'goal') return;
    const outs = [];
    lv.edges.forEach((e, j) => { if (e.frm === id && oset[e.gate]) outs.push(j); });
    if (!outs.length) return;
    const each = c / outs.length;
    outs.forEach(j => { flow[j] = each; acc[lv.edges[j].to] += each; });
  });
  return {val, flow};
}

/* ---------------- 放水 ---------------- */
function startFlow() {
  if (phase !== 'edit') return;
  phase = 'flow';
  if (bStart) bStart.style.opacity = .45;
  if (bReset) bReset.style.opacity = .45;
  const r = simulate(L, open);
  res = r;
  const layer = {}; L.nodes.forEach(n => layer[n.id] = -1);
  L.nodes.filter(n => n.kind === 'src').forEach(n => layer[n.id] = 0);
  for (let it = 0; it < L.nodes.length + 2; it++)
    L.edges.forEach(e => { if (layer[e.frm] >= 0 && layer[e.to] < layer[e.frm] + 1) layer[e.to] = layer[e.frm] + 1; });

  const anim = [];
  L.edges.forEach((e, j) => {
    if (!(r.flow[j] > 0)) return;
    const p = E('path', {d:dOf(e.pts), fill:'none', stroke:C.water, 'stroke-width':38,
      'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.95}, gWater);
    const len = polyLen(e.pts);
    p.setAttribute('stroke-dasharray', len);
    p.setAttribute('stroke-dashoffset', len);
    anim.push({p, delay: Math.max(0, layer[e.frm]) * 420});
  });
  requestAnimationFrame(() => {
    anim.forEach(o => {
      o.p.style.transition = 'stroke-dashoffset 620ms linear ' + o.delay + 'ms';
      o.p.setAttribute('stroke-dashoffset', 0);
    });
  });
  const total = (anim.length ? Math.max(...anim.map(o => o.delay)) : 0) + 620 + 260;
  setTimeout(finishFlow, total);
}

function finishFlow() {
  phase = 'done';
  const goals = L.nodes.filter(n => n.kind === 'goal')
    .sort((a, b) => a.label.localeCompare(b.label, 'zh'));
  goals.forEach(g => {
    const t = gText.querySelector('[data-goal="' + g.id + '"]');
    if (t) {
      const shown = res.val[g.id] || 0;
      const num = (Math.abs(shown - Math.round(shown)) < 1e-9) ? Math.round(shown) : shown.toFixed(1);
      const pre = t.textContent.indexOf('：') >= 0 ? '所需水量：' : '';
      t.textContent = pre + num + '/' + g.need;
    }
  });
  const allOk = goals.every(g => Math.abs((res.val[g.id] || 0) - g.need) < 1e-6);
  showResult(allOk, goals);
}

function resetLevel() {
  if (phase === 'flow') return;
  renderLevel(cur);
}

/* ---------------- 结算 ---------------- */
function showResult(ok, goals) {
  const rows = goals.slice().sort((a, b) => a.label.localeCompare(b.label, 'zh')).map(g => {
    const v = res.val[g.id] || 0;
    const num = (Math.abs(v - Math.round(v)) < 1e-9) ? Math.round(v) : v.toFixed(1);
    const hit = Math.abs(v - g.need) < 1e-6;
    return '<div class="row"><span>' + g.label + ' 需要 ' + g.need +
      '</span><b class="' + (hit ? 'ok' : 'no') + '">实际 ' + num + ' ' + (hit ? '✔' : '✘') + '</b></div>';
  }).join('');
  const stagn = L.nodes.filter(n => n.kind !== 'goal' && n.kind !== 'src')
    .reduce((s, n) => s, 0);
  dlg.innerHTML =
    '<h2>' + (ok ? '通关成功' : '通关失败') + '</h2>' + rows +
    '<div class="hint">' + (ok ? '全部目标点水量正确。'
      : '目标点水量必须「恰好」等于需求；蓄水池里没流出去的水不退还，请调整水闸后重试。') + '</div>' +
    '<div class="acts"><button class="pri" id="btnAgain">重玩本关</button>' +
    '<button id="btnSel">返回选关</button></div>';
  mask.classList.remove('hide');
  dlg.querySelector('#btnAgain').onclick = () => { mask.classList.add('hide'); renderLevel(cur); };
  dlg.querySelector('#btnSel').onclick = renderSelect;
}

/* ---------------- 自适应 ---------------- */
function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * 0.96;
  stage.setAttribute('width', 1920 * s);
  stage.setAttribute('height', 1080 * s);
  selBox.style.fontSize = Math.max(12, 15 * s) + 'px';
}
window.addEventListener('resize', fit);
fit();
renderSelect();
</script>
</body>
